<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>JEENIUS | Animation Lab</title><style>
:root{--navy:#013062;--pale:#e6eeff;--line:#dce5f2;--ink:#17375f;--muted:#6b7f9c;--panel:#f8faff;--blue:#2367c9}*{box-sizing:border-box}body{margin:0;background:#f5f8ff;color:var(--ink);font-family:Arial,Helvetica,sans-serif;padding:22px}.shell{max-width:1150px;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:25px}.brand{font-size:23px;font-weight:900;display:flex;align-items:center;gap:10px;color:var(--navy)}.brand img{width:38px;height:38px;object-fit:contain}.top a{font-size:12px;font-weight:800;color:var(--blue);text-decoration:none}.hero,.catalog{background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:0 12px 35px #0130620a;margin-bottom:16px}.kicker{font-size:11px;color:var(--blue);font-weight:850;letter-spacing:.12em;text-transform:uppercase}.hero h1{font-size:32px;letter-spacing:-1px;color:var(--navy);margin:9px 0}.hero p{font-size:14px;color:var(--muted);line-height:1.6;max-width:700px;margin:0}.tools{display:grid;grid-template-columns:minmax(220px,1fr) 180px;gap:10px;margin:15px 0}.tools input,.tools select{height:45px;width:100%;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:#fff;font:inherit;color:var(--ink)}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.count{font-size:12px;font-weight:800;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.lab{border:1px solid var(--line);border-radius:13px;padding:15px;display:flex;flex-direction:column;gap:9px;min-height:175px;background:#fff}.lab h2{font-size:14px;line-height:1.35;margin:0;color:var(--navy)}.pills{display:flex;gap:6px;flex-wrap:wrap;font-size:10px;color:var(--muted)}.pill{background:#edf3ff;border-radius:99px;padding:4px 7px;font-weight:800}.desc{font-size:12px;line-height:1.45;color:var(--muted);flex:1}.open{border:1px solid var(--line);background:white;border-radius:9px;min-height:36px;padding:7px 10px;font-size:12px;font-weight:800;color:var(--navy);cursor:pointer}.empty{padding:30px 10px;text-align:center;color:var(--muted);grid-column:1/-1}.message{font-size:12px;color:var(--muted);margin-top:12px}@media(max-width:850px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:580px){body{padding:12px}.hero,.catalog{padding:17px}.hero h1{font-size:26px}.tools{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.top{align-items:flex-start}}
</style></head><body><main class="shell"><header class="top"><div class="brand"><img src="/brand/geini-happy.png" alt=""><span>JEENIUS · Animation Lab</span></div><a href="/dashboard.html">← Home</a></header><section class="hero"><div class="kicker">Explore interactively</div><h1>Search the animation library</h1><p>Find any uploaded interactive animation by topic, subject or class. This page contains animations only—no Geini chat panel.</p></section><section class="catalog"><div class="row"><strong>Available animations</strong><span id="count" class="count">Loading catalogue…</span></div><div class="tools"><input id="search" type="search" placeholder="Search animation or topic…" aria-label="Search animations"><select id="subject" aria-label="Filter by subject"><option value="all">All subjects</option><option value="PHY">Physics</option><option value="CHE">Chemistry</option><option value="BIO">Biology</option><option value="SCI">Science</option><option value="ENV">Environment</option><option value="MATH">Mathematics</option><option value="MAT">Mathematics</option><option value="OTHER">Other</option></select></div><div id="grid" class="grid" aria-live="polite"><div class="empty">Loading animations…</div></div><div id="message" class="message" role="status" aria-live="polite"></div></section></main><script>
'use strict';const $=id=>document.getElementById(id);let items=[];async function api(path){const r=await fetch(path,{cache:'no-store',credentials:'same-origin',headers:{Accept:'application/json'}});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Could not load data.');return d}function visible(){const term=$('search').value.trim().toLowerCase(),sub=$('subject').value;return items.filter(x=>x.available!==false&&(sub==='all'||String(x.subject||'OTHER').toUpperCase()===sub)&&(!term||[x.title,x.id,x.subject,x.class,x.tryThis].join(' ').toLowerCase().includes(term)))}function render(){const found=visible(),grid=$('grid');grid.replaceChildren();$('count').textContent=found.length+' of '+items.filter(x=>x.available!==false).length+' animations';if(!found.length){const e=document.createElement('div');e.className='empty';e.textContent='No animations match that search. Try a different term or subject.';grid.append(e);return}for(const item of found){const card=document.createElement('article');card.className='lab';const h=document.createElement('h2');h.textContent=item.title||item.id;const pills=document.createElement('div');pills.className='pills';for(const t of [String(item.subject||'OTHER'),'Class '+(item.class||'8–10')]){const b=document.createElement('span');b.className='pill';b.textContent=t;pills.append(b)}const desc=document.createElement('div');desc.className='desc';desc.textContent=item.tryThis||'Explore this interactive animation.';const open=document.createElement('button');open.type='button';open.className='open';open.textContent='Open animation ↗';open.addEventListener('click',()=>{location.href='/animations/'+encodeURIComponent(item.id)+'/index.html'});card.append(h,pills,desc,open);grid.append(card)}}$('search').addEventListener('input',render);$('subject').addEventListener('change',render);async function init(){const me=await api('/api/auth/me?fresh='+Date.now());if(!me.authenticated||!me.user){location.replace('/auth.html');return}if(!me.access_ready){location.replace('/account-setup.html');return}const d=await api('/api/animations/catalog?fresh='+Date.now());items=Array.isArray(d)?d:[];render()}init().catch(e=>{$('count').textContent='Could not load';$('message').textContent=e.message||'Catalogue failed to load. Refresh the page.';$('grid').innerHTML='<div class="empty">Could not load the animation catalogue. Please refresh or check deployment.</div>'});document.addEventListener('visibilitychange',()=>{if(!document.hidden)init().catch(()=>{})});
</script></body></html>
