T('g ON EACH PLACE (m/s²)',540,80,12,'left',1);GR.forEach((x,i)=>{const y=106+i*28;R(540,y-16,210,24,i==S.pl?N:W,N,1.2);T(PN[i],550,y,13,'left',1,i==S.pl?W:N);T(String(x),740,y,13,'right',1,i==S.pl?W:N)});

f:'t = √(2h ÷ g) = √(2 × '+S.h+' ÷ '+g+') = '+Tf.toFixed(2)+' s     weight = m × g = '+S.m+' × '+g+' = '+(S.m*g).toFixed(1)+' N',res:[['fall time',Tf,'s'],['landing speed',Math.sqrt(2*g*S.h),'m/s']]}}};
const S0={};
P.forEach(p=>{if(p.t){p.a=0;p.b=1}let v=Q.get(p.k);v=(v===null||v===''||isNaN(+v))?p.v:+v;S[p.k]=cl(v,p.a,p.b);S0[p.k]=S[p.k]});

P.forEach(p=>{const d=document.createElement('div');d.className='row';

(SIM.btns||[]).concat([['RESET',()=>{Object.assign(S,S0);SIM.init(S,M);base=null;clearTimeout(tm)}]]).forEach(a=>{const b=document.createElement('button');b.type='button';b.textContent=a[0];b.onclick=()=>a[1](S,M);bt.appendChild(b)});

let dn=0;const xy=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*VW/r.width,(e.clientY-r.top)*VH/r.height]};

let dispBase=null,dispRo=null,dispTm=0,dispSnap='';
