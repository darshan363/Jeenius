<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>53-substances-in-common-use</title></head><body><script src="../_shared/lab.js"></script><script>Lab((() => { const D = [['Baking soda', 'NaHCO3', 'Sodium hydrogen carbonate. Used in cooking and antacids; gives off carbon dioxide when heated, so cakes become soft.'],
