<style>*{box-sizing:border-box;margin:0}

@media(max-width:480px){body{padding:10px 10px 20px}h1{font-size:clamp(17px,6vw,24px)}#ro b{max-width:48%;font-size:11px}#ro div{font-size:11px;gap:6px}#fx{font-size:12px;line-height:1.75}}

<header class="sh w"><div class="ch"><div class="g">JEENIUS </div><h1>Equation Balance Lab</h1></div></header>
<section class="sh"><div class="ch"><canvas id="cv" aria-label="Equation Balance Lab interactive animation"></canvas></div></section>
<aside class="sh"><div class="ch"><h2>CONTROLS</h2><div id="ctl"></div><div id="bt"></div><h2>LIVE READOUTS</h2><div id="ro"></div></div></aside>
<footer class="sh w"><div class="ch"><span class="g">FORMULA WITH LIVE NUMBERS</span><div id="fx"></div><div id="chg" aria-live="polite"></div></div></footer></main><script>
const N='#013062',B='#e6eeff',G='#e9e9e9',W='#fff',Q=new URLSearchParams(location.search),VW=800,VH=450;
const cl=(x,a,b)=>Math.min(b,Math.max(a,x)),sin=Math.sin,cos=Math.cos,PI=Math.PI;
const cv=document.getElementById('cv'),c=cv.getContext('2d'),S={},M={},D={"n": 23, "t": "Equation Balance", "p": [{"k": "a", "l": "Number of x boxes (a)", "a": 1, "b": 5, "s": 1, "v": 3}, {"k": "x", "l": "Mass of one x box", "u": " units", "a": 1, "b": 10, "s": 1, "v": 7}, {"k": "b", "l": "Loose weights on left (b)", "a": 1, "b": 12, "s": 1, "v": 5}]},P=D.p;
function fit(){const r=cv.getBoundingClientRect(),d=window.devicePixelRatio||1;cv.width=r.width*d;cv.height=r.height*d;c.setTransform(cv.width/VW,0,0,cv.height/VH,0,0)}
addEventListener('resize',fit);
const L=(a,b,x,y,w=1,d=0,col=N,al=1)=>{c.globalAlpha=al;c.strokeStyle=col;c.lineWidth=w;c.setLineDash(d?[d,d]:[]);c.beginPath();c.moveTo(a,b);c.lineTo(x,y);c.stroke();c.setLineDash([]);c.globalAlpha=1};
const T=(s,x,y,z=12,al='left',g=0,col=N)=>{c.fillStyle=col;c.font=z+'px '+(g?'Goldman':'Saira')+',sans-serif';c.textAlign=al;c.fillText(s,x,y)};
const R=(x,y,w,h,f,s,lw=1)=>{if(f){c.fillStyle=f;c.fillRect(x,y,w,h)}if(s){c.strokeStyle=s;c.lineWidth=lw;c.strokeRect(x,y,w,h)}};
const K=(x,y,r,f,s,lw=1)=>{c.beginPath();c.arc(x,y,r,0,7);if(f){c.fillStyle=f;c.fill()}if(s){c.strokeStyle=s;c.lineWidth=lw;c.stroke()}};
const AR=(a,b,x,y,w=1.5)=>{if(Math.hypot(x-a,y-b)<3)return;L(a,b,x,y,w);const t=Math.atan2(y-b,x-a);c.fillStyle=N;c.beginPath();c.moveTo(x,y);c.lineTo(x-9*cos(t-.4),y-9*sin(t-.4));c.lineTo(x-9*cos(t+.4),y-9*sin(t+.4));c.fill()};
const DIM=(a,b,x,y,s)=>{L(a,b,x,y,.8);L(a,b-5,a,b+5,.8);L(x,y-5,x,y+5,.8);T(s,(a+x)/2,b-7,11,'center',1)};

const E=(x,y,rx,ry,rot,f,s,lw=1)=>{c.beginPath();c.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),rot||0,0,7);if(f){c.fillStyle=f;c.fill()}if(s){c.strokeStyle=s;c.lineWidth=lw;c.stroke()}};
const PG=(pts,f,s,lw=1,al=1)=>{c.globalAlpha=al;c.beginPath();pts.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));c.closePath();if(f){c.fillStyle=f;c.fill()}if(s){c.strokeStyle=s;c.lineWidth=lw;c.stroke()}c.globalAlpha=1};
const WR=(s,x,y,w,z=12,lh=16,g=0)=>{c.font=z+'px '+(g?'Goldman':'Saira')+',sans-serif';let ln='',yy=y;String(s).split(' ').forEach(wd=>{const u=ln?ln+' '+wd:wd;if(c.measureText(u).width>w&&ln){T(ln,x,yy,z,'left',g);yy+=lh;ln=wd}else ln=u});if(ln){T(ln,x,yy,z,'left',g);yy+=lh}return yy};
const ez=x=>x*x*(3-2*x);

const PXC=300,PYC=150,HB=190;// CHECK: a = 3, x = 7, b = 5 -> 3x + 5 = 26; take 5 off both sides: 3x = 21; divide both by 3: x = 7 (check 3×7 + 5 = 26)
const f1=v=>String(+v.toFixed(2));
const eqs=M=>(M.nb==1?'x':f1(M.nb)+'x')+(M.ul?' + '+M.ul:'')+' = '+f1(M.ur);
function push(M,txt){M.stk.push({nb:M.nb,ul:M.ul,ur:M.ur,h:M.hist.slice()});M.hist.push(txt)}
const SIM={init(S,M){M.sig='';M.msg='';M.mt=0;M.ang=0},
btns:[['TAKE ALL LOOSE WEIGHTS OFF BOTH SIDES',(S,M)=>{if(M.ul>0&&M.ur>=M.ul){push(M,'');const u=M.ul;M.ur-=u;M.ul=0;M.hist[M.hist.length-1]=eqs(M);M.hist.splice(M.hist.length-1,1,'− '+u+' both → '+eqs(M))}else{M.msg='NOTHING TO TAKE OFF';M.mt=2}}],
['DIVIDE BOTH SIDES BY a',(S,M)=>{if(M.ul>0){M.msg='FIRST TAKE THE LOOSE WEIGHTS OFF BOTH SIDES';M.mt=2;return}if(M.nb>1){push(M,'');const d=M.nb;M.ur/=d;M.nb=1;M.hist.splice(M.hist.length-1,1,'÷ '+f1(d)+' both → '+eqs(M))}}],
['UNDO',(S,M)=>{const s=M.stk.pop();if(s){M.nb=s.nb;M.ul=s.ul;M.ur=s.ur;M.hist=s.h}}]],
drag(S,M,x,y,f){if(!f)return;if(y>150&&y<390&&x<PXC-20&&M.ul>0){push(M,'');M.ul--;M.hist.splice(M.hist.length-1,1,'took 1 off LEFT only → '+eqs(M))}else if(y>150&&y<390&&x>PXC+20&&M.ur>=1){push(M,'');M.ur--;M.hist.splice(M.hist.length-1,1,'took 1 off RIGHT only → '+eqs(M))}},
draw(S,M,t,dt){const sig=S.a+','+S.x+','+S.b;if(M.sig!==sig){M.sig=sig;M.nb=S.a;M.ul=S.b;M.ur=S.a*S.x+S.b;M.stk=[];M.hist=[];M.hist.push(eqs(M))}
M.mt=Math.max(0,M.mt-dt);
const mL=M.nb*S.x+M.ul,mR=M.ur,diff=mL-mR,tgt=cl(diff/Math.max(mL,mR,1)*40,-14,14);M.ang+=(tgt-M.ang)*Math.min(1,dt*4);const an=M.ang*PI/180;
const ex=PXC-HB*cos(an),ey=PYC+HB*sin(an),fx=PXC+HB*cos(an),fy=PYC-HB*sin(an);
L(PXC,PYC,PXC,350,6);R(PXC-60,350,120,14,G,N,2);L(ex,ey,fx,fy,10,0,N);L(ex,ey,fx,fy,6,0,B);K(PXC,PYC,8,W,N,3);
const pan=(x,y,left)=>{L(x,y,x-80,y+110,1.2);L(x,y,x+80,y+110,1.2);L(x-90,y+110,x+90,y+110,4);
let cx=x-80,by=y+110;if(left){for(let i=0;i<Math.ceil(M.nb);i++){const w=Math.min(1,M.nb-i);R(cx+i*38,by-34*w,34,34*w,B,N,2);T('x',cx+i*38+17,by-12,14,'center',1)}
for(let i=0;i<M.ul;i++)K(cx+7+(i%11)*14,by-(M.nb>0?40:6)-Math.floor(i/11)*14,6,G,N,1.5)}
else for(let i=0;i<Math.floor(M.ur);i++)K(cx+7+(i%12)*13.5,by-6-Math.floor(i/12)*13,6,G,N,1.5);if(!left&&M.ur%1>.001)T('+ '+f1(M.ur%1),x+60,by-8,10,'left',1)};
pan(ex,ey,1);pan(fx,fy,0);
T(eqs(M),60,66,24,'left',1);T(Math.abs(diff)<.001?'BALANCED':diff>0?'LEFT SIDE HEAVIER':'RIGHT SIDE HEAVIER',780,66,14,'right',1);
const solved=M.nb==1&&M.ul==0;if(solved)T(Math.abs(M.ur-S.x)<.001?'x = '+f1(M.ur)+'   CHECK: '+S.a+' × '+f1(M.ur)+' + '+S.b+' = '+(S.a*M.ur+S.b)+'  ✓':'x = '+f1(M.ur)+'  (pans are unbalanced)',PXC,392,14,'center',1);
else T(M.mt>0?M.msg:'CLICK A PAN TO TAKE 1 WEIGHT OFF THAT SIDE ONLY',PXC,392,M.mt>0?12:10,'center',M.mt>0?1:0);
T('STEPS',600,100,11,'left',1);L(600,106,780,106,1);M.hist.slice(-9).forEach((h,i)=>WR(h,600,126+i*30,180,10,12));
const fs=M.hist.map(h=>h.replace(/^[^→]*→ /,'').replace(/^(took|− |÷ ).*?→ ?/,'')).join('  →  ');
return{r:[['Equation now',eqs(M)],['Left pan mass',f1(mL)],['Right pan mass',f1(mR)],['Difference',f1(Math.abs(diff))],['Beam',Math.abs(diff)<.001?'BALANCED':diff>0?'left down':'right down'],['Steps taken',M.hist.length-1],['x found',solved?f1(M.ur):'not yet']],f:fs,res:[['pan difference',Math.abs(diff),''],['steps taken',M.hist.length-1,'']]}}};

const S0={};
P.forEach(p=>{if(p.t){p.a=0;p.b=1}let v=Q.get(p.k);v=(v===null||v===''||isNaN(+v))?p.v:+v;S[p.k]=cl(v,p.a,p.b);S0[p.k]=S[p.k]});
const ctl=document.getElementById('ctl'),bt=document.getElementById('bt'),ro=document.getElementById('ro'),fx=document.getElementById('fx'),els={};
const fv=(p,x)=>p.n?p.n[Math.round(x)]:(+x.toFixed(2))+(p.u||'');
P.forEach(p=>{const d=document.createElement('div');d.className='row';
d.innerHTML='<label><span>'+p.l+'</span><b></b></label>'+(p.t?'<button type="button" aria-pressed="false"></button>':'<input type="range" min="'+p.a+'" max="'+p.b+'" step="'+p.s+'" aria-label="'+p.l+'">');
ctl.appendChild(d);const e=d.querySelector(p.t?'button':'input'),v=d.querySelector('b');els[p.k]=[e,v,p];
if(p.t)e.onclick=()=>{S[p.k]=1-S[p.k]};else e.oninput=()=>{S[p.k]=+e.value}});
function sync(){for(const k in els){const[e,v,p]=els[k],x=S[k],s=fv(p,x);if(p.t){e.textContent=p.n?p.n[x]:(x?'ON':'OFF');e.setAttribute('aria-pressed',x?'true':'false');v.textContent=''}else{if(+e.value!==x)e.value=x;v.textContent=s}}}
(SIM.btns||[]).concat([['RESET',()=>{Object.assign(S,S0);SIM.init(S,M);base=null;clearTimeout(tm)}]]).forEach(a=>{const b=document.createElement('button');b.type='button';b.textContent=a[0];b.onclick=()=>a[1](S,M);bt.appendChild(b)});
window.addEventListener("message", e => { if (e.data && e.data.type === "jeenius-params") { const q=e.data.params||{}; P.forEach(p=>{if(q[p.k]!==undefined&&!isNaN(+q[p.k]))S[p.k]=cl(+q[p.k],p.a,p.b)}); } });
let dn=0;const xy=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*VW/r.width,(e.clientY-r.top)*VH/r.height]};
cv.onpointerdown=e=>{dn=1;try{cv.setPointerCapture(e.pointerId)}catch(_){}SIM.drag&&SIM.drag(S,M,...xy(e),1)};
cv.onpointermove=e=>{dn&&SIM.drag&&SIM.drag(S,M,...xy(e),0)};cv.onpointerup=cv.onpointercancel=()=>{dn=0};
addEventListener('keydown',e=>{SIM.key&&SIM.key(S,e,M)});

let dispBase=null,dispRo=null,dispTm=0,dispSnap='';
function roMap(){const m={};(cur.r||[]).forEach(a=>m[a[0]]=String(a[1]));return m}
function showChg(){const el=document.getElementById('chg');if(!el||!cur)return;const sn=JSON.stringify(S);
if(!dispBase){dispBase={...S};dispRo=roMap();bres0=(cur.res||[]).map(r=>r.slice());dispSnap=sn;return}
if(sn===dispSnap)return;dispSnap=sn;clearTimeout(dispTm);
dispTm=setTimeout(()=>{const ch=P.filter(p=>dispBase[p.k]!==S[p.k]);if(!ch.length)return;
const now=roMap(),res=cur.res||[];let out=[];
res.forEach((r,i)=>{const b=bres0&&bres0[i];if(b&&Math.abs(r[1]-b[1])>1e-6)out.push(r[0]+' '+(r[1]>b[1]?'rises':'falls')+' '+(+b[1].toFixed(2))+' → '+(+r[1].toFixed(2))+' '+r[2])});
if(!out.length){for(const k in now){if(dispRo[k]!==undefined&&dispRo[k]!==now[k])out.push(k+': '+dispRo[k]+' → '+now[k])}out=out.slice(0,3)}
el.innerHTML='';const a=document.createElement('span');a.textContent='IF '+ch.map(p=>p.l.toLowerCase()+' '+fv(p,dispBase[p.k])+' → '+fv(p,S[p.k])).join(', ');el.append(a);
const b=document.createElement('span');b.textContent=out.length?'  ⇒  '+out.join('; '):'  ⇒  the result stays the same';el.append(b);
dispBase={...S};dispRo=now;bres0=res.map(r=>r.slice())},350)}
let bres0=null;
let last=0,tm=0,base=null,bres=[],cur={},snap='',lh='',lf='';
function rep(){if(!base)return;const ch=P.filter(p=>base[p.k]!==S[p.k]);if(!ch.length)return;
let s='student changed '+ch.map(p=>p.l.toLowerCase()+' '+fv(p,base[p.k])+' -> '+fv(p,S[p.k])).join(', ');
(cur.res||[]).forEach((r,i)=>{const b=bres[i];if(b&&Math.abs(r[1]-b[1])>1e-6)s+='; '+r[0]+' '+(r[1]>b[1]?'rose':'fell')+' from '+(+b[1].toFixed(2))+' '+r[2]+' to '+(+r[1].toFixed(2))+' '+r[2]});
base={...S};bres=(cur.res||[]).map(r=>r.slice());
window.parent.postMessage({ type: "jeenius-event", summary: s }, "*")}
function frame(ts){const dt=Math.min(.05,(ts-last)/1000||0);last=ts;
c.clearRect(0,0,VW,VH);R(0,0,VW,VH,W);
for(let x=0;x<=VW;x+=25)L(x,0,x,VH,.5,0,N,x%100?.07:.16);for(let y=0;y<=VH;y+=25)L(0,y,VW,y,.5,0,N,y%100?.07:.16);
cur=SIM.draw(S,M,ts/1000,dt)||{};
sync();showChg();
if(!base){base={...S};bres=(cur.res||[]).map(r=>r.slice())}
const h=(cur.r||[]).map(a=>'<div><span>'+a[0]+'</span><b>'+a[1]+'</b></div>').join('');if(h!==lh){ro.innerHTML=h;lh=h}
if(cur.f!==lf){fx.textContent=cur.f||'';lf=cur.f}
const sn=JSON.stringify(S);if(sn!==snap){snap=sn;clearTimeout(tm);tm=setTimeout(rep,1500)}
requestAnimationFrame(frame)}
fit();SIM.init(S,M);requestAnimationFrame(frame);
</script>
