<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>60-variation</title></head><body><script src="../_shared/lab.js"></script><script>Lab((() => ({ title: 'Variation: Direct and Inverse',
  ctrl: [{ k: 't', label: 'Type', opts: ['Direct: cost = 3 × notebooks', 'Inverse: sweets each = 12 ÷ friends'], val: 0 }, { k: 'x', label: 'Number (x)', min: 1, max: 12, val: 3 }],
  draw: v => { const y = v.t == 0 ? 3 * v.x : 12 / v.x, mx = v.t == 0 ? 36 : 12; return T(60, 50, 'x = ' + v.x, 14, '#12305c', 'start', 700) + R(60, 60, 280 * v.x / 12, 24, '#a9c8f0') + T(60, 115, 'y = ' + (Math.round(y * 10) / 10), 14, '#12305c', 'start', 700) + R(60, 125, 280 * y / mx, 24, v.t == 0 ? '#5fb37a' : '#e0a050') },
  say: v => v.t == 0 ? 'x = ' + v.x + ' gives y = ' + 3 * v.x + '. If x doubles, y also doubles: direct variation (y/x is constant).' : 'x = ' + v.x + ' gives y = ' + Math.round(12 / v.x * 10) / 10 + '. If x doubles, y becomes half: inverse variation (x × y is constant).' }))())</script></body></html>
