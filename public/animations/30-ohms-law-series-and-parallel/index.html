<header class="sh w"><div class="ch"><div class="g">JEENIUS · CLASS 8–9 · MAHARASHTRA STATE BOARD · SHEET 30 OF 40</div><h1>Ohm's Law, Series and Parallel</h1></div></header>

else{fl(160,212,160,110,sp(I),t);fl(160,110,380,110,sp(I),t);fl(380,110,380,190,sp(I1),t);fl(380,250,380,330,sp(I1),t);fl(380,110,520,110,sp(I2),t);fl(520,110,520,190,sp(I2),t);fl(520,250,520,330,sp(I2),t);fl(520,330,380,330,sp(I2),t);fl(380,330,160,330,sp(I),t);fl(160,330,160,228,sp(I),t);
zv(380,190,250);zv(520,190,250);T('R1 = '+S.R1+' Ω',360,214,12,'right',1);T('I1 = '+I1.toFixed(2)+' A',360,232,12,'right');T('R2 = '+S.R2+' Ω',540,214,12,'left',1);T('I2 = '+I2.toFixed(2)+' A',540,232,12,'left');T('same voltage across each branch',450,360,12,'center',1)}
return{r:[['Connection',par?'PARALLEL':'SERIES'],['Equivalent R',Rq.toFixed(2)+' Ω'],['Total current I',I.toFixed(2)+' A'],par?['I1, I2',I1.toFixed(2)+', '+I2.toFixed(2)+' A']:['V1, V2',(I*S.R1).toFixed(1)+', '+(I*S.R2).toFixed(1)+' V']],
f:'I = V ÷ R = '+S.V+' ÷ '+Rq.toFixed(2)+' = '+I.toFixed(2)+' A     '+(par?'1/R = 1/'+S.R1+' + 1/'+S.R2:'R = '+S.R1+' + '+S.R2),res:[['total current',I,'A'],['equivalent resistance',Rq,'Ω']]}}};
const S0={};
P.forEach(p=>{if(p.t){p.a=0;p.b=1}let v=Q.get(p.k);v=(v===null||v===''||isNaN(+v))?p.v:+v;S[p.k]=cl(v,p.a,p.b);S0[p.k]=S[p.k]});
const ctl=document.getElementById('ctl'),bt=document.getElementById('bt'),ro=document.getElementById('ro'),fx=document.getElementById('fx'),els={};

d.innerHTML='<label><span>'+p.l+'</span><b></b></label>'+(p.t?'<button type="button" aria-pressed="false"></button>':'<input type="range" min="'+p.a+'" max="'+p.b+'" step="'+p.s+'" aria-label="'+p.l+'">');
ctl.appendChild(d);const e=d.querySelector(p.t?'button':'input'),v=d.querySelector('b');els[p.k]=[e,v,p];

(SIM.btns||[]).concat([['RESET',()=>{Object.assign(S,S0);SIM.init(S,M);base=null;clearTimeout(tm)}]]).forEach(a=>{const b=document.createElement('button');b.type='button';b.textContent=a[0];b.onclick=()=>a[1](S,M);bt.appendChild(b)});

(cur.res||[]).forEach((r,i)=>{const b=bres[i];if(b&&Math.abs(r[1]-b[1])>1e-6)s+='; '+r[0]+' '+(r[1]>b[1]?'rose':'fell')+' from '+(+b[1].toFixed(2))+' '+r[2]+' to '+(+r[1].toFixed(2))+' '+r[2]});
