<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>56-disaster-management</title></head><body><script src="../_shared/lab.js"></script><script>Lab((() => { const D = [['Earthquake', '🏚️', 'Drop, cover and hold under a strong table. Stay away from windows. Go to an open area once shaking stops.'],
  ['Flood', '🌊', 'Move to higher ground. Do not walk or drive through flood water. Switch off electricity.'],
  ['Cyclone', '🌀', 'Stay indoors. Keep a torch and radio ready. Follow official warnings.'], ['Lightning', '⚡', 'Stay indoors. Keep away from trees, open fields and water.']]

  say: v => D[v.d][2] } })())</script></body></html>
