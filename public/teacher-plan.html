<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store">
<title>JEENIUS | Teacher Plan</title>
<style>
:root{--navy:#013062;--pale:#e6eeff;--line:#dce5f2;--ink:#17375f;--muted:#6b7f9c;--blue:#2367c9;--green:#147a45;--red:#b42318}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 15% 10%,#e6eeff 0,transparent 36%),linear-gradient(135deg,#f8faff,#edf3ff);color:var(--ink);font-family:Arial,Helvetica,sans-serif;padding:22px;display:grid;place-items:center}.shell{width:min(760px,100%);margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin:0 0 22px}.brand{font-size:24px;font-weight:900;letter-spacing:-.7px;color:var(--navy)}.top a{color:var(--blue);font-size:13px;font-weight:750;text-decoration:none}.card{background:#fff;border:1px solid var(--line);border-radius:24px;padding:clamp(22px,5vw,38px);box-shadow:0 20px 60px #01306210}.eyebrow{color:var(--blue);text-transform:uppercase;font-size:11px;font-weight:850;letter-spacing:.12em}.card h1{font-size:clamp(29px,5vw,42px);line-height:1.08;color:var(--navy);letter-spacing:-1.2px;margin:10px 0 13px}.intro{margin:0;color:var(--muted);font-size:15px;line-height:1.7;max-width:600px}.price-row{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:22px 0 18px;margin:22px 0 7px;border-top:1px solid #edf1f7}.old-price{font-size:14px;color:#8b99ad}.price{font-size:37px;color:var(--navy);font-weight:900;line-height:1.1;margin-top:4px}.free{display:inline-block;margin-top:8px;background:#e8f7ef;color:var(--green);padding:6px 10px;border-radius:99px;font-size:11px;font-weight:850;letter-spacing:.03em}.enter{border:0;border-radius:12px;padding:14px 20px;background:var(--navy);color:#fff;font-size:14px;font-weight:850;cursor:pointer;min-height:48px;white-space:nowrap;box-shadow:0 7px 18px #01306222}.enter:hover{background:#124b86}.enter:disabled{opacity:.45;cursor:not-allowed}.status{display:none;margin-top:16px;padding:12px 14px;border-radius:11px;border:1px solid var(--line);background:#edf4ff;font-size:13px;line-height:1.5}.status.show{display:block}.status.error{background:#fff0ef;color:var(--red);border-color:#ffd3ce}.status.success{background:#e8f7ef;color:var(--green);border-color:#b5e7cb}.foot{margin:17px 0 0;color:var(--muted);font-size:12px;line-height:1.6}@media(max-width:560px){body{padding:14px}.top{margin-bottom:14px}.brand{font-size:21px}.card{border-radius:19px;padding:22px 18px}.price-row{align-items:stretch;flex-direction:column;gap:16px}.enter{width:100%}.price{font-size:32px}}
</style>
</head>
<body><main class="shell">
<header class="top"><div class="brand">JEENIUS</div><a href="/account-setup.html?edit=1">My profile</a></header>
<section class="card"><div class="eyebrow">Teacher plan</div><h1>Your teaching workspace, ready to go.</h1><p class="intro">Your teacher plan is free. Enter JEENIUS to use Ask Geini and the Animation Lab with your students.</p>
<div class="price-row"><div><div class="old-price"><s>₹999 / month</s></div><div class="price">₹0 <span style="font-size:14px;font-weight:650">/ month</span></div><span class="free">FREE · NO PAYMENT</span></div><button id="enter" class="enter" type="button">Enter JEENIUS →</button></div>
<div id="status" class="status" role="status" aria-live="polite"></div><p class="foot"><a href="/classroom.html">Open Classroom: invite students, set homework and tests →</a></p></section></main>
<script>
'use strict';const $=id=>document.getElementById(id);function status(text,type=''){const e=$('status');e.textContent=text;e.className='status show '+type;}
async function init(){try{const r=await fetch('/api/auth/me?fresh='+Date.now(),{cache:'no-store',credentials:'same-origin',headers:{Accept:'application/json'}});const d=await r.json().catch(()=>({}));if(!r.ok||!d.authenticated||!d.user){location.replace('/auth.html');return;}if(!d.user||d.user.account_role!=='teacher'){location.replace('/account-setup.html');return;}if(!d.access_ready){$('enter').disabled=true;status('Your account is waiting for admin approval. The Enter button will unlock after approval.','');}}catch(_){status('Could not check account access. Refresh the page and try again.','error');}}
$('enter').addEventListener('click',async()=>{const b=$('enter');b.disabled=true;b.textContent='Opening JEENIUS…';try{const r=await fetch('/api/auth/me?fresh='+Date.now(),{cache:'no-store',credentials:'same-origin',headers:{Accept:'application/json'}});const d=await r.json().catch(()=>({}));if(!r.ok||!d.authenticated||!d.user){location.replace('/auth.html');return;}if(!d.access_ready){status('Your account is waiting for admin approval.','error');return;}location.href='/dashboard.html';}catch(_){status('Could not open JEENIUS. Check your connection and try again.','error');}finally{b.disabled=false;b.textContent='Enter JEENIUS →';}});document.addEventListener('visibilitychange',()=>{if(!document.hidden)init().catch(()=>{})});init();
</script></body></html>
