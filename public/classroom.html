<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#013062">
<title>JEENIUS | Classroom</title>
<style>
:root{--navy:#013062;--pale:#e6eeff;--line:#dce5f2;--ink:#17375f;--muted:#6b7f9c;--blue:#2367c9;--green:#147a45;--red:#b42318;--panel:#f8faff}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Inter,"Segoe UI",Arial,sans-serif;background:radial-gradient(circle at 15% 10%,#e6eeff,#f6f9ff 45%,#fff);color:var(--ink);padding:max(16px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom))}
.wrap{max-width:900px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:9px;font-weight:850;letter-spacing:-.8px;font-size:22px;color:var(--navy)}.brand img{width:32px;height:32px}
.top a{color:var(--blue);font-weight:700;text-decoration:none;font-size:14px}
h1{font-size:28px;letter-spacing:-.8px;margin:0 0 4px;color:var(--navy)}
.sub{color:var(--muted);font-size:14px;margin:0 0 18px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:16px;box-shadow:0 10px 30px #01306210}
.card h2{font-size:17px;margin:0 0 12px;color:var(--navy)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input,select,textarea{font:inherit;font-size:16px;border:1px solid #c8d8ec;border-radius:11px;padding:11px 12px;color:var(--ink);background:#fff;outline:none;max-width:100%}
input:focus,select:focus,textarea:focus{border-color:#4a83d3;box-shadow:0 0 0 3px #2367c916}
textarea{width:100%;min-height:90px;resize:vertical}
label.f{display:block;font-size:13px;font-weight:700;margin:12px 0 6px}
button{font:inherit;font-weight:750;font-size:14px;border-radius:11px;padding:11px 16px;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--navy)}
button.primary{background:var(--navy);border-color:var(--navy);color:#fff}button:disabled{opacity:.55;cursor:wait}
button.danger{color:var(--red)}button.small{padding:7px 11px;font-size:12px}
.msg{display:none;margin:10px 0 0;padding:10px 12px;border-radius:10px;font-size:13px;background:#f3f6fb}.msg.show{display:block}.msg.error{background:#fff0ef;color:var(--red)}.msg.ok{background:#ecf9f0;color:var(--green)}
.list>div{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.list>div:first-child{border-top:0}
.muted{color:var(--muted);font-size:13px}
.chip{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.4px;border-radius:999px;padding:3px 9px;background:var(--pale);color:var(--navy)}.chip.test{background:#fff3df;color:#8a5200}.chip.ok{background:#ecf9f0;color:var(--green)}
.idbox{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.idcode{font:800 30px/1 Goldman,"Segoe UI",monospace;letter-spacing:3px;color:var(--navy);background:var(--pale);padding:14px 18px;border-radius:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}.seg button{border:0;border-radius:0}.seg button[aria-pressed=true]{background:var(--navy);color:#fff}
.qcard{border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px;background:var(--panel)}
.opt{display:flex;gap:8px;align-items:center;margin-top:8px}.opt input[type=text]{flex:1;min-width:0}.opt input[type=radio]{width:20px;height:20px}
.checks{display:flex;flex-wrap:wrap;gap:8px}.checks label{display:flex;gap:7px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:13px;background:#fff}
.work{border-top:1px solid var(--line);padding:14px 0}.work:first-child{border-top:0}.work h3{margin:6px 0 4px;font-size:16px}
.choice{display:flex;gap:10px;align-items:flex-start;padding:9px 11px;border:1px solid var(--line);border-radius:11px;margin-top:7px;cursor:pointer}
.choice.right{border-color:#8bd0a8;background:#ecf9f0}.choice.wrong{border-color:#efb1ab;background:#fff0ef}
.hidden{display:none!important}
@media(max-width:520px){h1{font-size:24px}.card{padding:16px}.idcode{font-size:24px}}
</style>
</head>
<body>
<main class="wrap">
  <header class="top"><div class="brand"><img src="/brand/geini-happy.png" alt=""><span>JEENIUS</span></div><a href="/">← Home</a></header>
  <h1>Classroom</h1>
  <p class="sub" id="sub">Loading…</p>
  <div id="app"></div>
</main>
<script>
'use strict';
const app = document.getElementById('app');
let LABS = [], FLASH = null;
const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v === false || v == null) continue;
    if (k === 'class') n.className = v; else if (k.startsWith('on')) n.addEventListener(k.slice(2), v); else if (k === 'checked' || k === 'disabled' || k === 'selected') n[k] = !!v; else n.setAttribute(k, v);
  }
  kids.flat().forEach(c => { if (c != null && c !== false) n.append(c.nodeType ? c : document.createTextNode(String(c))); });
  return n;
};
async function api(path, body) {
  const r = await fetch(path, { method: body ? 'POST' : 'GET', credentials: 'same-origin', cache: 'no-store', headers: { Accept: 'application/json', ...(body ? { 'Content-Type': 'application/json' } : {}) }, body: body ? JSON.stringify(body) : undefined });
  const d = await r.json().catch(() => ({}));
  if (r.status === 401) { location.replace('/auth.html'); throw new Error('Please sign in.'); }
  if (!r.ok) throw new Error(d.error || 'Something went wrong. Please try again.');
  return d;
}
function msg(box, text, type = 'error') { box.textContent = text; box.className = 'msg show ' + type; }
const labName = id => (LABS.find(l => l.id === id) || {}).title || 'Animation';
const dueText = d => d ? 'Due ' + new Date(d + 'T00:00').toLocaleDateString(undefined, { day: 'numeric', month: 'short' }) : 'No due date';

/* =========================== TEACHER =========================== */
function teacherView(data) {
  document.getElementById('sub').textContent = 'Invite students by their Student ID, then give them homework and tests.';
  const active = data.students.filter(s => s.status === 'active');
  const state = { kind: 'homework', questions: [newQ()], picked: new Set(active.map(s => s.student_id)) };
  function newQ() { return { q: '', options: ['', '', '', ''], correct: 0 }; }

  // ---- invite ----
  const inviteMsg = el('div', { class: 'msg' }), codeInput = el('input', { type: 'text', placeholder: 'JNS-XXXXXX', maxlength: '12', autocomplete: 'off', autocapitalize: 'characters', 'aria-label': 'Student ID' });
  const inviteBtn = el('button', { class: 'primary', onclick: async () => {
    inviteBtn.disabled = true;
    try { const d = await api('/api/classroom/invite', { student_code: codeInput.value }); codeInput.value = ''; FLASH = { where: 'invite', text: d.message }; await load(false); }
    catch (e) { msg(inviteMsg, e.message); } finally { inviteBtn.disabled = false; }
  } }, 'Send invite');
  codeInput.addEventListener('keydown', e => { if (e.key === 'Enter') inviteBtn.click(); });
  const inviteCard = el('section', { class: 'card' }, el('h2', {}, 'Invite a student'), el('p', { class: 'muted' }, 'Students find their ID on their own Classroom page.'), el('div', { class: 'row' }, codeInput, inviteBtn), inviteMsg);

  if (FLASH && FLASH.where === 'invite') { msg(inviteMsg, FLASH.text, 'ok'); FLASH = null; }

  // ---- students ----
  const studentRows = data.students.length ? data.students.map(s => el('div', {},
    el('div', {}, el('strong', {}, s.status === 'active' ? s.name : 'Invited: ' + s.code), el('div', { class: 'muted' }, s.status === 'active' ? 'Class ' + s.standard + ' · ' + s.code : 'Waiting for the student to accept')),
    el('button', { class: 'small danger', onclick: async () => { if (confirm(s.status === 'active' ? 'Remove ' + s.name + ' from your class?' : 'Cancel this invitation?')) { await api('/api/classroom/remove', { link_id: s.link_id }); load(); } } }, s.status === 'active' ? 'Remove' : 'Cancel')))
    : [el('p', { class: 'muted' }, 'No students yet. Send an invite above.')];
  const studentsCard = el('section', { class: 'card' }, el('h2', {}, 'My students (' + active.length + ')'), el('div', { class: 'list' }, studentRows));

  // ---- new assignment ----
  const title = el('input', { type: 'text', maxlength: '120', placeholder: 'e.g. Chapter 4 practice', style: 'width:100%' }),
    body = el('textarea', { maxlength: '2000', placeholder: 'Instructions for students (optional for tests)' }),
    due = el('input', { type: 'date' }),
    lab = el('select', {}, el('option', { value: '' }, 'No animation'), ...LABS.map(l => el('option', { value: l.id }, l.title))),
    formMsg = el('div', { class: 'msg' }), qBox = el('div'), kindSeg = el('div', { class: 'seg' }), picks = el('div', { class: 'checks' });
  function drawKind() {
    kindSeg.replaceChildren(...['homework', 'test'].map(k => el('button', { type: 'button', 'aria-pressed': String(state.kind === k), onclick: () => { state.kind = k; drawKind(); } }, k === 'homework' ? 'Homework' : 'Test')));
    qBox.classList.toggle('hidden', state.kind !== 'test'); drawQ();
  }
  function drawQ() {
    qBox.replaceChildren(...state.questions.map((q, qi) => el('div', { class: 'qcard' },
      el('div', { class: 'row', style: 'justify-content:space-between' }, el('strong', {}, 'Question ' + (qi + 1)), state.questions.length > 1 ? el('button', { type: 'button', class: 'small danger', onclick: () => { state.questions.splice(qi, 1); drawQ(); } }, 'Delete') : null),
      el('input', { type: 'text', maxlength: '300', placeholder: 'Question', value: q.q, style: 'width:100%;margin-top:8px', oninput: e => q.q = e.target.value }),
      ...q.options.map((o, oi) => el('div', { class: 'opt' }, el('input', { type: 'radio', name: 'c' + qi, checked: q.correct === oi, 'aria-label': 'Correct answer ' + (oi + 1), onchange: () => q.correct = oi }), el('input', { type: 'text', maxlength: '120', placeholder: 'Option ' + 'ABCD'[oi] + (oi > 1 ? ' (optional)' : ''), value: o, oninput: e => q.options[oi] = e.target.value }))),
      el('div', { class: 'muted', style: 'margin-top:6px' }, 'Select the circle next to the correct answer.'))),
      state.questions.length < 20 ? el('button', { type: 'button', style: 'margin-top:12px', onclick: () => { state.questions.push(newQ()); drawQ(); } }, '+ Add question') : null);
  }
  function drawPicks() {
    picks.replaceChildren(...(active.length ? active.map(s => el('label', {}, el('input', { type: 'checkbox', checked: state.picked.has(s.student_id), onchange: e => e.target.checked ? state.picked.add(s.student_id) : state.picked.delete(s.student_id) }), s.name)) : [el('span', { class: 'muted' }, 'Invite and wait for students to accept first.')]));
  }
  const createBtn = el('button', { class: 'primary', style: 'margin-top:16px', onclick: async () => {
    createBtn.disabled = true;
    try {
      const questions = state.kind === 'test' ? state.questions.map(q => {
        const kept = q.options.map((o, i) => [o.trim(), i]).filter(([o]) => o);
        return { q: q.q, options: kept.map(([o]) => o), correct: kept.findIndex(([, i]) => i === q.correct) };
      }) : undefined;
      const d = await api('/api/classroom/assign', { kind: state.kind, title: title.value, body: body.value, due_date: due.value, lab_id: lab.value, student_ids: [...state.picked], questions });
      FLASH = { where: 'form', text: 'Sent to ' + d.assigned + ' student' + (d.assigned === 1 ? '' : 's') + '.' };
      await load(false);
    } catch (e) { msg(formMsg, e.message); } finally { createBtn.disabled = false; }
  } }, 'Send to students');
  drawKind(); drawPicks();
  if (FLASH && FLASH.where === 'form') { msg(formMsg, FLASH.text, 'ok'); FLASH = null; }
  const formCard = el('section', { class: 'card' }, el('h2', {}, 'New homework or test'), kindSeg,
    el('label', { class: 'f' }, 'Title'), title, el('label', { class: 'f' }, 'Instructions'), body,
    el('div', { class: 'row' }, el('div', {}, el('label', { class: 'f' }, 'Due date'), due), el('div', {}, el('label', { class: 'f' }, 'Attach an animation'), lab)),
    qBox, el('label', { class: 'f' }, 'Send to'), picks, createBtn, formMsg);

  // ---- assignments ----
  const list = data.assignments.length ? data.assignments.map(a => {
    const detail = el('div', { class: 'hidden' });
    return el('div', { class: 'work' },
      el('span', { class: 'chip ' + (a.kind === 'test' ? 'test' : '') }, a.kind === 'test' ? 'TEST' : 'HOMEWORK'), el('h3', {}, a.title),
      el('div', { class: 'muted' }, dueText(a.due_date) + ' · ' + a.submitted + ' of ' + a.assigned + ' submitted' + (a.lab_id ? ' · ' + labName(a.lab_id) : '')),
      el('div', { class: 'row', style: 'margin-top:8px' },
        el('button', { class: 'small', onclick: async () => { if (!detail.classList.contains('hidden')) { detail.classList.add('hidden'); return; } const d = await api('/api/classroom/assignment?id=' + a.id); detail.replaceChildren(...resultRows(d)); detail.classList.remove('hidden'); } }, 'Results'),
        el('button', { class: 'small danger', onclick: async () => { if (confirm('Delete "' + a.title + '" for everyone?')) { await api('/api/classroom/delete', { id: a.id }); load(); } } }, 'Delete')), detail);
  }) : [el('p', { class: 'muted' }, 'Nothing assigned yet.')];
  function resultRows(d) {
    return d.students.map(s => el('div', { style: 'padding:8px 0;border-top:1px solid var(--line)' },
      el('strong', {}, s.name), ' ', s.status === 'submitted' ? el('span', { class: 'chip ok' }, d.kind === 'test' ? s.score + ' / ' + s.total : 'DONE') : el('span', { class: 'chip' }, 'PENDING'),
      s.answer_text ? el('div', { class: 'muted', style: 'white-space:pre-wrap;margin-top:4px' }, s.answer_text) : null));
  }
  return [inviteCard, studentsCard, formCard, el('section', { class: 'card' }, el('h2', {}, 'Assignments'), ...list)];
}

/* =========================== STUDENT =========================== */
function studentView(data) {
  document.getElementById('sub').textContent = 'Share your Student ID with your teacher to join their class.';
  const copyMsg = el('span', { class: 'muted' });
  const idCard = el('section', { class: 'card' }, el('h2', {}, 'Your Student ID'), el('div', { class: 'idbox' }, el('div', { class: 'idcode' }, data.student_code || '—'),
    el('button', { onclick: async () => { try { await navigator.clipboard.writeText(data.student_code); copyMsg.textContent = 'Copied'; } catch (_) { copyMsg.textContent = 'Select and copy the ID'; } } }, 'Copy'), copyMsg));
  const cards = [idCard];
  if (data.invites.length) cards.push(el('section', { class: 'card' }, el('h2', {}, 'Invitations'), el('div', { class: 'list' }, data.invites.map(i => el('div', {}, el('span', {}, el('strong', {}, i.teacher_name), ' invited you to their class'),
    el('div', { class: 'row' }, el('button', { class: 'primary small', onclick: async () => { await api('/api/classroom/respond', { link_id: i.link_id, accept: true }); load(); } }, 'Accept'), el('button', { class: 'small', onclick: async () => { await api('/api/classroom/respond', { link_id: i.link_id, accept: false }); load(); } }, 'Decline')))))));
  if (data.teachers.length) cards.push(el('section', { class: 'card' }, el('h2', {}, 'My teachers'), el('div', { class: 'list' }, data.teachers.map(t => el('div', {}, el('strong', {}, t.name),
    el('button', { class: 'small danger', onclick: async () => { if (confirm('Leave ' + t.name + '\u2019s class?')) { await api('/api/classroom/leave', { teacher_id: t.teacher_id }); load(); } } }, 'Leave'))))));
  const work = data.assignments.length ? data.assignments.map(workCard) : [el('p', { class: 'muted' }, data.teachers.length ? 'No homework or tests right now.' : 'Once a teacher adds you, their homework and tests appear here.')];
  cards.push(el('section', { class: 'card' }, el('h2', {}, 'Homework and tests'), ...work));
  return cards;
}
function workCard(a) {
  const box = el('div', { class: 'hidden' }), m = el('div', { class: 'msg' });
  const head = [el('span', { class: 'chip ' + (a.kind === 'test' ? 'test' : '') }, a.kind === 'test' ? 'TEST' : 'HOMEWORK'), el('h3', {}, a.title),
    el('div', { class: 'muted' }, a.teacher_name + ' · ' + dueText(a.due_date))];
  if (a.status === 'submitted') {
    head.push(el('div', { style: 'margin-top:6px' }, el('span', { class: 'chip ok' }, a.kind === 'test' ? 'Score ' + a.score + ' / ' + a.total : 'Submitted')));
    if (a.kind === 'test') head.push(el('button', { class: 'small', style: 'margin-top:8px', onclick: () => { box.classList.toggle('hidden'); } }, 'Review answers'), box), box.replaceChildren(...a.questions.map((q, qi) => el('div', { class: 'qcard' }, el('strong', {}, (qi + 1) + '. ' + q.q),
      ...q.options.map((o, oi) => el('div', { class: 'choice ' + (oi === q.correct ? 'right' : oi === a.answers[qi] ? 'wrong' : '') }, o + (oi === q.correct ? '  ✓' : oi === a.answers[qi] ? '  (your answer)' : ''))))));
    return el('div', { class: 'work' }, head);
  }
  if (a.body) head.push(el('p', { style: 'white-space:pre-wrap;margin:8px 0' }, a.body));
  if (a.lab_id) head.push(el('a', { href: '/animations/' + encodeURIComponent(a.lab_id) + '/index.html', target: '_blank', rel: 'noopener', style: 'color:var(--blue);font-weight:700' }, 'Open animation: ' + labName(a.lab_id) + ' ↗'));
  if (a.kind === 'homework') {
    const ans = el('textarea', { maxlength: '2000', placeholder: 'Write your answer or notes (optional)' }), done = el('button', { class: 'primary', style: 'margin-top:8px', onclick: async () => {
      done.disabled = true; try { await api('/api/classroom/submit', { assignment_id: a.id, answer_text: ans.value }); load(); } catch (e) { msg(m, e.message); done.disabled = false; } } }, 'Mark as done');
    head.push(el('div', { style: 'margin-top:10px' }, ans, done, m));
  } else {
    const picks = a.questions.map(() => -1);
    box.replaceChildren(...a.questions.map((q, qi) => el('div', { class: 'qcard' }, el('strong', {}, (qi + 1) + '. ' + q.q), ...q.options.map((o, oi) => el('label', { class: 'choice' }, el('input', { type: 'radio', name: 'q' + a.id + qi, onchange: () => picks[qi] = oi }), o)))),
      el('button', { class: 'primary', style: 'margin-top:12px', onclick: async e => {
        if (picks.includes(-1)) { msg(m, 'Answer every question before submitting.'); return; }
        if (!confirm('Submit your test? You cannot change it afterwards.')) return;
        e.target.disabled = true; try { await api('/api/classroom/submit', { assignment_id: a.id, answers: picks }); load(); } catch (er) { msg(m, er.message); e.target.disabled = false; } } }, 'Submit test'), m);
    head.push(el('button', { class: 'primary small', style: 'margin-top:8px', onclick: () => box.classList.toggle('hidden') }, 'Start test'), box);
  }
  return el('div', { class: 'work' }, head);
}

/* =========================== LOAD =========================== */
async function load(first = true) {
  try {
    if (first && !LABS.length) { try { const c = await api('/api/animations/catalog'); LABS = (Array.isArray(c) ? c : []).filter(l => l.available !== false); } catch (_) {} }
    const data = await api('/api/classroom');
    app.replaceChildren(...(data.role === 'teacher' ? teacherView(data) : studentView(data)));
  } catch (e) { document.getElementById('sub').textContent = e.message; }
}
load();
document.addEventListener('visibilitychange', () => { if (!document.hidden && !document.querySelector('input:focus,textarea:focus')) load(false); });
</script>
</body>
</html>
